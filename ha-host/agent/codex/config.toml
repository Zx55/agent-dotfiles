model = "gpt-5.5"
model_reasoning_effort = "high"
service_tier = "fast"

notify = [
    "~/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient",
    "turn-ended"
]

approval_policy = "on-request"
approvals_reviewer = "user"

sandbox_mode = "workspace-write"
default_permissions = "secret_safe"
personality = "pragmatic"

[permissions.secret_safe.filesystem]
":project_roots" = { "." = "write" }
"~/.secret" = "none"
"~/Documents/agent-dotfiles/master/dotfiles/secrets/secret.local" = "none"
"~/Documents/agent-dotfiles/ha-host/dotfiles/secrets/secret.local" = "none"

[permissions.secret_safe.network]
enabled = true

[projects]
"~/Documents/agent-dotfiles" = { trust_level = "trusted" }
"~/Documents/codex-workspace" = { trust_level = "trusted" }
"~/Documents/codex-workspace/papers" = { trust_level = "trusted" }
"~/Documents/codex-workspace/TPAMI" = { trust_level = "trusted" }
"~/Documents/codex-workspace/mihome-geek" = { trust_level = "trusted" }

[plugins]
"github@openai-curated" = { enabled = true }
"build-web-apps@openai-curated" = { enabled = true }

[plugins."presentations@openai-primary-runtime" ]
enabled = true

[plugins."spreadsheets@openai-primary-runtime" ]
enabled = true

[plugins."documents@openai-primary-runtime" ]
enabled = true

[plugins."computer-use@openai-bundled" ]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[marketplaces.openai-bundled]
last_updated = "2026-05-31T03:41:25Z"
source_type = "local"
source = "~/.codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
last_updated = "2026-05-22T04:27:24Z"
source_type = "local"
source = "~/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

[features]
memories = true
js_repl = false

[memories]
disable_on_external_context = true

[mcp_servers.node_repl]
args = []
command = "/Applications/Codex.app/Contents/Resources/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = ""
NODE_REPL_NODE_PATH = "/Applications/Codex.app/Contents/Resources/node"
NODE_REPL_TRUSTED_CODE_PATHS = "~/.codex"
CODEX_HOME = "~/.codex"
NODE_REPL_TRUSTED_BROWSER_CLIENT_SHA256S = "0b0d41e7a14a4903d2f95b0b3f427ed796b12c8edca2fa392a03df43997075ae"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = "Control the in-app browser in conjunction with the Browser Plugin."
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = "Control the Chrome browser in conjunction with the Chrome Plugin. Prefer this method of controlling Chrome over alternatives (such as Computer Use) unless the user explicitly mentions an alternative."
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
SKY_CUA_SERVICE_PATH = "~/.codex/plugins/cache/openai-bundled/computer-use/1.0.799/Codex Computer Use.app"
CODEX_CLI_PATH = "/Applications/Codex.app/Contents/Resources/codex"

[desktop]
appearanceLightCodeThemeId = "codex"
appearanceDarkCodeThemeId = "codex"
sansFontSize = 15
codeFontSize = 14
usePointerCursors = true
followUpQueueMode = "steer"
reviewDelivery = "detached"
preventSleepWhileRunning = true
keepRemoteControlAwakeWhilePluggedIn = true
git-show-sidebar-pr-icons = true
git-commit-instructions = """
### Commit Style

- restrict commit subjects to the approved lowercase prefixes: `docs:`, `feat:`, `fix:`, `refactor:`, `test:`, `chore` and `release:`
- keep the subject focused on the primary architectural or behavioral change instead of listing every touched area"""
notifications-turn-mode = "always"
selected-avatar-id = "custom:asuka-2"

[desktop.appearanceLightChromeTheme]
accent = "#0169cc"
contrast = 45
ink = "#0d0d0d"
opaqueWindows = false
surface = "#ffffff"
fonts = { code = "monaco", ui = "Inter" }
semanticColors = { diffAdded = "#00a240", diffRemoved = "#e02e2a", skill = "#751ed9" }

[desktop.appearanceDarkChromeTheme]
accent = "#0169cc"
contrast = 60
ink = "#fcfcfc"
opaqueWindows = false
surface = "#111111"
fonts = { code = "monaco", ui = "Inter" }
semanticColors = { diffAdded = "#00a240", diffRemoved = "#e02e2a", skill = "#b06dff" }

[desktop.open-in-target-preferences]
global = "vscode"
