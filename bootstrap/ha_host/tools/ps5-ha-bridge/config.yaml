version: "0.2.10"
slug: ps5_ha_bridge
name: PS5 HA Bridge
description: Expose PlayStation 5 scene-level power and status to Home Assistant over MQTT.
url: https://github.com/local/agent-dotfiles/tree/main/bootstrap/ha_host/tools/ps5-ha-bridge
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
services:
  - mqtt:need
hassio_api: true
hassio_role: default
host_network: true
ingress: true
ingress_port: 8099
panel_icon: mdi:sony-playstation
panel_title: PS5 Bridge
map:
  - config:rw
options:
  log_level: info
  mqtt:
    host: core-mosquitto
    port: 1883
    username: ""
    password: ""
    discovery_prefix: homeassistant
    base_topic: ps5-ha-bridge/ps5
    client_id: ps5-ha-bridge
  bridge:
    poll_interval_seconds: 30
    availability_failures: 3
    command_transition_timeout_seconds: 60
    command_transition_poll_seconds: 1
    actual_state_confirmations: 3
    discovery_name: PS5
schema:
  log_level: list(debug|info|warning|error)
  mqtt:
    host: str
    port: port
    username: str?
    password: password?
    discovery_prefix: str
    base_topic: str
    client_id: str
  bridge:
    poll_interval_seconds: int
    availability_failures: int
    command_transition_timeout_seconds: int
    command_transition_poll_seconds: int
    actual_state_confirmations: int
    discovery_name: str
