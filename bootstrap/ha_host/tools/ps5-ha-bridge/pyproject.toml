[project]
name = "ps5-ha-bridge"
version = "0.2.11"
description = "Small Home Assistant MQTT bridge for PlayStation 5 power/status control."
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9,<4",
  "paho-mqtt>=2,<3",
  "playdirector==0.3.0",
  "PyYAML>=6,<7",
]

[project.scripts]
ps5-ha-bridge = "ps5_ha_bridge.cli:main"
ps5-ha-bridge-addon = "ps5_ha_bridge.addon:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
