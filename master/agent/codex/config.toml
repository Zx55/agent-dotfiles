[desktop]
appearanceLightCodeThemeId = "codex"
appearanceDarkCodeThemeId = "codex"
sansFontSize = 15
codeFontSize = 14
usePointerCursors = true
followUpQueueMode = "steer"
reviewDelivery = "detached"
preventSleepWhileRunning = true
keepRemoteControlAwakeWhilePluggedIn = true
git-show-sidebar-pr-icons = true
git-commit-instructions = """
### Commit Style

- restrict commit subjects to the approved lowercase prefixes: `docs:`, `feat:`, `fix:`, `refactor:`, `test:`, `chore` and `release:`
- keep the subject focused on the primary architectural or behavioral change instead of listing every touched area"""
notifications-turn-mode = "always"
selected-avatar-id = "custom:asuka-2"

