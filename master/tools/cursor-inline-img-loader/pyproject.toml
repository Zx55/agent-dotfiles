[project]
name = "cursor-inline-img-loader"
version = "0.1.0"
description = "Tiny MCP server that returns local image files as ImageContent for Cursor."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cursor-inline-img-loader = "cursor_inline_img_loader.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
